---
# Debian or derivative specific tasks.

# Task for configuring SSH for public key authentication.
- name: Configuring SSH for Public Key Authentication.
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^PubkeyAuthentication
    line: PubkeyAuthentication yes

# Task for setting the hostname.
- name: Setting the hostname.
  ansible.builtin.hostname:
    name: localhost

# Task for restarting the SSH daemon.
- name: Restarting the SSH daemon.
  ansible.builtin.systemd:
    name: ssh
    state: restarted
    daemon_reload: true

# Task for disabling systemd-tmpfiles.
- name: Disabling systemd-tmpfiles.
  ansible.builtin.replace:
    path: /usr/lib/tmpfiles.d/tmp.conf
    regexp: ^D
    replace: "#D"

# Tasks for configuring cloud-init.
- name: Configuring cloud-init.
  when: enable_cloudinit == 'true'
  block:
    - name: "Message: Configuring cloud-init"
      ansible.builtin.debug:
        msg: Configuring cloud-init
    - name: Remove unnecessary configuration files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cloud/cloud.cfg.d/subiquity-disable-cloudinit-networking.cfg
        - /etc/cloud/cloud.cfg.d/99-installer.cfg
        - /etc/cloud/cloud.cfg.d/90-installer-network.cfg
        - /etc/netplan/00-installer-config.yaml
        - /etc/netplan/50-cloud-init.yaml
      when: ansible_distribution == 'Ubuntu'
    - name: Install a first-boot DHCP netplan fallback
      ansible.builtin.copy:
        dest: /etc/netplan/99-dhcp-en.yaml
        owner: root
        group: root
        mode: "0600"
        # Not 50-cloud-init.yaml: typical VCFA runcmd deletes that name.
        # match en* so vmx-22 ens33 (or other PCI names) still get DHCP.
        content: |
          network:
            version: 2
            ethernets:
              all-en:
                match:
                  name: en*
                dhcp4: true
      when: ansible_distribution == 'Ubuntu'
    - name: Ensure disable_vmware_customization is set to false in cloud.cfg
      ansible.builtin.blockinfile:
        path: /etc/cloud/cloud.cfg
        block: |
          disable_vmware_customization: false
    - name: Set datasource_list in 90_dpkg.cfg
      ansible.builtin.copy:
        content: "datasource_list: [ VMware, OVF, None ]"
        dest: /etc/cloud/cloud.cfg.d/90_dpkg.cfg
    - name: "Running cloud-init clean command"
      command: sudo cloud-init clean --machine-id
      become: yes
      become_method: sudo
      become_user: root
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 24


# ubuntu-cc-v0.4 ships a pre-created schulz user. VCFA cloudConfig often
# write_files with owner: schulz:schulz in the init stage (before
# users_groups, and without defer: true) and later runcmd assumes ~schulz
# exists. Without this user, chown fails and later write_files (including
# the blueprint netplan) may never be written.
- name: Ensure the schulz user exists for VCFA cloudConfig
  when: enable_cloudinit == 'true' and ansible_distribution == 'Ubuntu'
  block:
    - name: Creating the local group for schulz
      ansible.builtin.group:
        name: schulz
    - name: Creating the local user for schulz
      ansible.builtin.user:
        name: schulz
        group: schulz
        groups: sudo,adm,cdrom,dip,plugdev
        append: true
        password: "!"
        shell: /bin/bash
        create_home: true
        home: /home/schulz
    - name: Managing the authorized key for schulz
      ansible.posix.authorized_key:
        user: schulz
        key: "{{ build_key }}"
      no_log: true
    - name: Managing sudoers.d for schulz
      community.general.sudoers:
        name: schulz
        user: schulz
        commands: ALL

- name: Replacing dhcp with static for Debian
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    regexp: ^iface ens192 inet dhcp
    state: absent
  when: enable_cloudinit == 'true' and ansible_distribution == 'Debian'

# Task for setting SSH keys to regenerate.
- name: Setting SSH keys to regenerate.
  ansible.builtin.copy:
    dest: /etc/rc.local
    content: |
      #!/bin/bash
      if test -z "$(find /etc/ssh/ -iname 'ssh_host_*_key*')"; then
          dpkg-reconfigure openssh-server
      fi
      exit 0
    mode: "0755"

# Task to force setting guest operating system information for VMware Tools.
- name: Setting guest operating system information for VMware Tools.
  ansible.builtin.blockinfile:
    path: /etc/vmware-tools/tools.conf
    block: |
      [guestosinfo]
      short-name = other5xLinux64Guest
    create: true
    mode: "0644"
  when: ansible_distribution == 'Debian'
